name: Windows Build

on:
  push:
    branches: [ ui-effect-match ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download PDFium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path third_party/pdfium | Out-Null
          $url = 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8066/pdfium-win-x64.tgz'
          Invoke-WebRequest -Uri $url -OutFile third_party/pdfium/pdfium.tgz
          tar -xzf third_party/pdfium/pdfium.tgz -C third_party/pdfium
          Remove-Item third_party/pdfium/pdfium.tgz
          if (-not (Test-Path 'third_party/pdfium/include/fpdfview.h')) { throw 'PDFium header fpdfview.h not found' }
          if (-not (Get-ChildItem 'third_party/pdfium' -Filter pdfium.dll -Recurse)) { throw 'PDFium runtime pdfium.dll not found' }

      - name: Validate source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          if ($cmake -notmatch 'src/InkStrokeJoin\.cpp') { throw 'CMake source manifest is missing InkStrokeJoin.cpp' }
          if (-not (Test-Path 'src/InkStrokeJoin.cpp')) { throw 'src/InkStrokeJoin.cpp is missing from checkout' }
          if (-not (Test-Path 'src/InkDirtyRegion.cpp')) { throw 'src/InkDirtyRegion.cpp is missing from checkout' }
          if (-not (Test-Path 'src/WindowsInkVectorBridge.cpp')) { throw 'src/WindowsInkVectorBridge.cpp is missing from checkout' }
          if (-not (Test-Path 'src/InkVectorGeometry.cpp')) { throw 'src/InkVectorGeometry.cpp is missing from checkout' }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pdfium = (Resolve-Path 'third_party/pdfium').Path
          cmake -S . -B build -A x64 "-DPDFIUM_DIR=$pdfium"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build/Release/PDFDarkReader.exe artifacts/PDFDarkReader.exe
          $dll = Get-ChildItem -Path third_party/pdfium -Filter pdfium.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'pdfium.dll not found after extraction' }
          Copy-Item $dll.FullName artifacts/pdfium.dll

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDFDarkReader-Windows-x64
          path: artifacts/
